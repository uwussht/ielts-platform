
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ secrets.DEPLOY_USER }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      APP_DIR: ${{ secrets.DEPLOY_PATH || '/opt/ielts-platform' }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::notice::Deploy secrets are not set yet, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.cfg.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        if: steps.cfg.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/deploy -p "$PORT" "$USER@$HOST" \
            APP_DIR="$APP_DIR" SHA="$GITHUB_SHA" REPO="https://github.com/${GITHUB_REPOSITORY}.git" \
            'bash -s' <<'EOF'
          set -euo pipefail
          if [ ! -d "$APP_DIR/.git" ]; then
            git clone "$REPO" "$APP_DIR"
          fi
          cd "$APP_DIR"
          if [ ! -f .env ]; then
            echo "::error::$APP_DIR/.env is missing: copy .env.example and fill it in on the server."
            exit 1
          fi
          git fetch --prune origin main
          git reset --hard "$SHA"
          docker compose up -d --build --remove-orphans db api web
          # test audio and pictures: downloads in the background into the media volume,
          # skipping files already there, then exits (the site serves them from /media)
          docker compose up -d media
          docker image prune -f >/dev/null
          docker compose ps
          EOF

      - name: Smoke test
        if: steps.cfg.outputs.skip != 'true'
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://ielts.teenteched.kz/ || true)
            [ "$code" = "200" ] && { echo "Site is up"; exit 0; }
            sleep 5
          done
          echo "::warning::https://ielts.teenteched.kz/ answered $code after deploy"
