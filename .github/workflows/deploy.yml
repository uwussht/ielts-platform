
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ secrets.DEPLOY_USER }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      APP_DIR: ${{ secrets.DEPLOY_PATH || '/opt/ielts-platform' }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      # Repository variables (Settings → Secrets and variables → Actions → Variables), as on the
      # SAT platform: phones (and optionally emails) that become admins, comma-separated.
      ADMIN_PHONES: ${{ vars.IELTS_ADMIN_PHONES || vars.ADMIN_PHONES }}
      ADMIN_EMAILS: ${{ vars.IELTS_ADMIN_EMAILS || vars.ADMIN_EMAILS }}
      # Repository secrets for AI grading (Settings → Secrets and variables → Actions → Secrets).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TRANSCRIBE_API_KEY: ${{ secrets.TRANSCRIBE_API_KEY }}
      # The JTS admin panel account the test bank syncs from (server/src/sync.js): an ADMIN there.
      SOURCE_LOGIN: ${{ secrets.SOURCE_LOGIN }}
      SOURCE_PASSWORD: ${{ secrets.SOURCE_PASSWORD }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::notice::Deploy secrets are not set yet, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          # only phone and email characters travel to the server's shell
          phones_re='^[0-9+ ,()-]*$'
          emails_re='^[A-Za-z0-9@._+ ,-]*$'
          if [[ ! "$ADMIN_PHONES" =~ $phones_re ]]; then
            echo "::error::IELTS_ADMIN_PHONES may hold only phone numbers separated by commas."; exit 1
          fi
          if [[ ! "$ADMIN_EMAILS" =~ $emails_re ]]; then
            echo "::error::IELTS_ADMIN_EMAILS may hold only emails separated by commas."; exit 1
          fi
          keys_re='^[A-Za-z0-9_-]*$'
          if [[ ! "$ANTHROPIC_API_KEY" =~ $keys_re ]] || [[ ! "$TRANSCRIBE_API_KEY" =~ $keys_re ]]; then
            echo "::error::ANTHROPIC_API_KEY / TRANSCRIBE_API_KEY may hold only letters, digits, - and _."; exit 1
          fi
          [ -n "$ANTHROPIC_API_KEY" ] || echo "::notice::ANTHROPIC_API_KEY is not set: AI grading stays as the server's .env has it."
          [ -n "$ADMIN_PHONES" ] || echo "::notice::IELTS_ADMIN_PHONES is not set: admins stay as the server's .env has them."
          login_re='^[A-Za-z0-9@._+() -]*$'
          if [[ ! "$SOURCE_LOGIN" =~ $login_re ]]; then
            echo "::error::SOURCE_LOGIN may hold only a phone number or an email."; exit 1
          fi
          [ -n "$SOURCE_LOGIN" ] || echo "::notice::SOURCE_LOGIN is not set: the test bank does not sync from the admin panel."

      - name: Set up SSH
        if: steps.cfg.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        if: steps.cfg.outputs.skip != 'true'
        run: |
          # the password goes base64-encoded, so no character in it can break the shell or .env
          SOURCE_PASSWORD_B64=$(printf '%s' "$SOURCE_PASSWORD" | base64 -w0)
          ssh -i ~/.ssh/deploy -p "$PORT" "$USER@$HOST" \
            APP_DIR="$APP_DIR" SHA="$GITHUB_SHA" REPO="https://github.com/${GITHUB_REPOSITORY}.git" \
            ADMIN_PHONES="'$ADMIN_PHONES'" ADMIN_EMAILS="'$ADMIN_EMAILS'"             ANTHROPIC_API_KEY="'$ANTHROPIC_API_KEY'" TRANSCRIBE_API_KEY="'$TRANSCRIBE_API_KEY'"             SOURCE_LOGIN="'$SOURCE_LOGIN'" SOURCE_PASSWORD_B64="'$SOURCE_PASSWORD_B64'" \
            'bash -s' <<'EOF'
          set -euo pipefail
          if [ ! -d "$APP_DIR/.git" ]; then
            git clone "$REPO" "$APP_DIR"
          fi
          cd "$APP_DIR"
          # Made once and kept, as on the SAT platform: a new password would lock the API
          # out of the database that the existing volume already holds.
          if [ ! -s .env ]; then
            umask 077
            printf 'POSTGRES_PASSWORD=%s\n' "$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" > .env
            umask 022
            echo "Created .env with a new database password"
          fi
          # Admins from the repository variables, when they are set; otherwise .env keeps its own.
          set_env() {
            [ -n "$2" ] || return 0
            { grep -v "^$1=" .env || true; printf '%s=%s\n' "$1" "$2"; } > .env.next
            mv .env.next .env
            chmod 600 .env
            echo "$1 set from the repository settings"
          }
          set_env ADMIN_PHONES "$ADMIN_PHONES"
          set_env ADMIN_EMAILS "$ADMIN_EMAILS"
          set_env ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          set_env TRANSCRIBE_API_KEY "$TRANSCRIBE_API_KEY"
          set_env SOURCE_LOGIN "$SOURCE_LOGIN"
          set_env SOURCE_PASSWORD_B64 "$SOURCE_PASSWORD_B64"
          git fetch --prune origin main
          git reset --hard "$SHA"
          docker compose up -d --build --remove-orphans db api web
          # test audio and pictures: downloads in the background into the media volume,
          # skipping files already there, then exits (the site serves them from /media)
          docker compose up -d media
          docker image prune -f >/dev/null
          docker compose ps
          EOF

      - name: Smoke test
        if: steps.cfg.outputs.skip != 'true'
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://ielts.teenteched.kz/ || true)
            [ "$code" = "200" ] && { echo "Site is up"; exit 0; }
            sleep 5
          done
          echo "::warning::https://ielts.teenteched.kz/ answered $code after deploy"
