# The site, the platform's API (accounts, students' work, the staff area) and its database.
#   cp .env.example .env    (fill it in)
#   docker compose up -d --build      then open http://localhost:5173
# The media service downloads the test audio and pictures once (about 1.3 GB).
name: ielts-platform

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ielts
      POSTGRES_USER: ielts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ielts -d ielts"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # built from the root: the image also holds the test bank it checks answers against
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ielts:${POSTGRES_PASSWORD}@db:5432/ielts
      # Phones and emails that become admins when they sign up or sign in (comma-separated).
      ADMIN_PHONES: ${ADMIN_PHONES:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Course access ends at the end of its last day in this time zone.
      APP_TZ: ${APP_TZ:-Asia/Almaty}
      # Plan ids (as in js/config.js) and the ones a new student starts with.
      PLANS: ${PLANS:-self,coach}
      DEFAULT_PLANS: ${DEFAULT_PLANS:-self}
      # AI grading of Writing and Speaking (server/src/ai.js); empty key: they are saved but not graded.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-32000}
      # AI checks per student a day (AI_LIMIT_PERIOD: day | month | total); admins can change it per student.
      AI_LIMIT: ${AI_LIMIT:-10}
      AI_LIMIT_PERIOD: ${AI_LIMIT_PERIOD:-day}
      TRANSCRIBE_API_KEY: ${TRANSCRIBE_API_KEY:-}
      TRANSCRIBE_URL: ${TRANSCRIBE_URL:-https://api.openai.com/v1/audio/transcriptions}
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-whisper-1}
      TRANSCRIBE_LANG: ${TRANSCRIBE_LANG:-en}
      # The test bank follows the JTS admin panel (server/src/sync.js): an ADMIN account there.
      # Without it the bank stays as built into the image.
      SOURCE_URL: ${SOURCE_URL:-https://dev-server.justtostudy.kz}
      SOURCE_LOGIN: ${SOURCE_LOGIN:-}
      SOURCE_PASSWORD_B64: ${SOURCE_PASSWORD_B64:-}
      SYNC_EVERY_MIN: ${SYNC_EVERY_MIN:-10}
    volumes:
      # what the sync brings (the site reads it too) and new recordings and pictures
      - content-live:/app/content-live
      - media:/app/content/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:3000
      # While media is still downloading, missing files come from the original host.
      # Set MEDIA_FALLBACK= (empty) to serve only what is on disk.
      MEDIA_FALLBACK: ${MEDIA_FALLBACK-https://files.justtostudy.kz}
    volumes:
      - media:/app/content/media
      - content-live:/app/content-live:ro
    ports:
      # Localhost only: on the server Caddy proxies the domain to this port.
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      - api

  # One-off: downloads the test audio and pictures (content/media.txt, about 1.3 GB)
  # into the media volume, skipping files already there, then exits.
  media:
    build: .
    command: ["node", "scripts/fetch-media.js"]
    restart: "no"
    volumes:
      - media:/app/content/media

volumes:
  db-data:
  media:
  content-live:
